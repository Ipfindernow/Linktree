<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Interactive Links</title>
    <style>
        /* The requested Gradient Background */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(180deg, #001529 0%, #00a8ff 100%);
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            color: white;
        }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 40px 20px;
            text-align: center;
        }

        header h1 {
            font-size: 1.8rem;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        /* The Link Button style */
        .link-item {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 12px;
            margin-bottom: 20px;
            text-decoration: none; /* Removes the underline */
            color: white;
            transition: all 0.3s ease;
        }

        /* Interaction: Light up and pop out when hovered */
        .link-item:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        /* Thumbnail Image Styling */
        .link-img {
            width: 55px;
            height: 55px;
            border-radius: 10px;
            object-fit: cover;
            margin-right: 20px;
            background: #fff; /* Background for transparent icons */
        }

        .link-title {
            font-size: 1.1rem;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
     <img src="https://i.postimg.cc/G2HBB0vD/pfp.jpg" alt="Icon" class="link-img">
        <header>
            <h1>Connect With Me</h1>
        </header>

        <a href="https://discord.gg/B98ZxRnURv" target="_blank" class="link-item">
            <img src="https://static.vecteezy.com/system/resources/thumbnails/006/892/623/small/discord-logo-icon-editorial-free-vector.jpg" alt="Icon" class="link-img">
            <span class="link-title">Discord</span>
        </a>

        <a href="https://www.youtube.com/@Pulse_Ryot" target="_blank" class="link-item">
            <img src="https://static.vecteezy.com/system/resources/thumbnails/018/930/572/small/youtube-logo-youtube-icon-transparent-free-png.png" alt="Icon" class="link-img">
            <span class="link-title">Youtube</span>
        </a>

        <a href="https://www.twitch.tv/rlryot" target="_blank" class="link-item">
            <img src="https://i.postimg.cc/LXMkL861/twitch.png" alt="Icon" class="link-img">
            <span class="link-title">Twitch</span>
        </a>

        <a href="https://ryotup.myshopify.com/" target="_blank" class="link-item">
            <img src="https://i.postimg.cc/G2HBB0vD/pfp.jpg" alt="Icon" class="link-img">
            <span class="link-title">Ryotup</span>
        </a>

    </div>

</body>
</html>
